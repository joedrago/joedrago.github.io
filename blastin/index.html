<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>blastin'</title>
        <meta name="description" content="A first-person machine gun with a pile of sliders for tuning how it feels. Every tweak lives in the link." />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23ffb347' stroke-width='2'/%3E%3Ccircle cx='8' cy='8' r='1.5' fill='%23ffb347'/%3E%3C/svg%3E" />
        <link rel="stylesheet" href="style.css" />
        <script type="importmap">
            {
                "imports": {
                    "three": "./vendor/three/build/three.module.js",
                    "three/addons/": "./vendor/three/addons/"
                }
            }
        </script>
    </head>
    <body>
        <main id="stage">
            <canvas id="view"></canvas>

            <div id="crosshair" data-style="cross">
                <i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i><i class="ring"></i>
            </div>
            <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
            <div id="charge" hidden><i></i></div>
            <div id="numbers"></div>

            <div id="hud">
                <div id="ammo"></div>
                <div id="reloading" hidden>reloading</div>
                <div id="stats"></div>
            </div>
            <div id="mode-hint"></div>

            <div id="start" hidden>
                <div class="start-inner">
                    <h1>blastin'</h1>
                    <p class="cta">Click to play</p>
                    <ul>
                        <li><kbd>LMB</kbd> fire &nbsp; <kbd>RMB</kbd> aim down sights</li>
                        <li><kbd>Space</kbd> free the cursor to tune &nbsp; <kbd>R</kbd> reload &nbsp; <kbd>WASD</kbd> walk &nbsp; <kbd>Shift</kbd> sprint &nbsp; <kbd>Ctrl</kbd> crouch &nbsp; <kbd>F</kbd> fullscreen</li>
                    </ul>
                    <p class="small">Every slider you touch is saved in the address bar, so the link <em>is</em> the gun.</p>
                </div>
            </div>
        </main>

        <aside id="menu"></aside>

        <div id="loading">
            <div class="loading-inner">loading the range…</div>
        </div>
        <div id="error" hidden></div>

        <script type="module" src="js/main.js"></script>
    </body>
</html>
